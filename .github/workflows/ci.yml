# CI: Bei jedem Push und Pull Request werden die Tests automatisch ausgeführt.
# render.com deployt erst, wenn dieser Check grün ist (Auto-Deploy: "After CI Checks Pass").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - name: Tests ausführen
        run: pytest -v
